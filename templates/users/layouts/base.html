<!DOCTYPE html>
<html lang="en" class="{{ session.get('theme', 'light') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>
        {% block title %}SmartTrip - Golden Travel Companion{% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    {% block head %}{% endblock %}
</head>

<body class="bg-light text-dark">

<div x-data="{ sidebarOpen: false }" class="d-flex min-vh-100 position-relative">

    {% include 'users/partials/sidebar.html' %}

    <div class="d-flex flex-column flex-grow-1 min-vh-100" style="min-width:0;">

        {% include 'users/partials/topbar.html' %}

        <main class="flex-grow-1 py-4">
            <div class="container-fluid px-3 px-lg-4">
                <div class="mx-auto" style="max-width: 1500px;">
                    
                    {% block content %}
                    {% endblock %}

                </div>
            </div>
        </main>


    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.getElementById('themeToggle')?.addEventListener('click', () => {
    const isDark = document.documentElement.classList.toggle('dark');
    fetch('/api/user/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ theme_preference: isDark ? 'dark' : 'light' })
    });
});
</script>

{% block scripts %}{% endblock %}

</body>
</html>
