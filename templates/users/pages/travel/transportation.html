                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="text-muted fw-medium mb-0">Fetching express route schedules...</p>
            </div>

            <div id="searchResultsContent" class="overflow-auto" style="max-height: 800px;"></div>

        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const searchForm = document.getElementById('busSearchForm');
        const resultsWrapper = document.getElementById('resultsWrapper');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const searchResultsContent = document.getElementById('searchResultsContent');
        const departureDateInput = document.getElementById('departureDate');
        const operatorFilter = document.getElementById('operatorFilter');
        const searchSubmitBtn = document.getElementById('searchSubmitBtn');
        const searchBtnIcon = document.getElementById('searchBtnIcon');
        const searchBtnSpinner = document.getElementById('searchBtnSpinner');
        const searchBtnText = document.getElementById('searchBtnText');

        let currentTripsData = [];

        const todayStr = new Date().toISOString().split('T')[0];
        departureDateInput.min = todayStr;
        departureDateInput.value = todayStr;

        function renderTrips(trips) {
            if (!trips || trips.length === 0) {
                searchResultsContent.innerHTML = `
                    <div class="alert alert-warning text-center rounded-3 my-4">
                        No operators match your filter or search criteria.
                    </div>`;
                return;
            }

            let html = `<div class="d-flex flex-column gap-3">`;

            trips.forEach(trip => {
                const logoHtml = trip.operator_logo
                    ? `<img src="${trip.operator_logo}" alt="${trip.operator_name}" class="img-fluid rounded mb-1" style="max-height: 40px; object-fit: contain;">`
                    : `<div class="fw-bold text-primary fs-5">${trip.operator_name}</div>`;

                const featuresList = (trip.features && trip.features.length) ? trip.features : [];
                const featuresHtml = featuresList.length > 0
                    ? featuresList.map(f => `<span class="badge bg-success-subtle text-success border border-success-subtle me-1 mb-1 fw-medium"><i class="bi bi-check me-1"></i>${f}</span>`).join('')
                    : `<span class="badge bg-light text-secondary border me-1 mb-1">Express Bus</span>`;

                const routePathHtml = trip.route_path
                    ? `<div class="small text-muted mt-2">
                         <i class="bi bi-signpost-split-fill text-primary me-1"></i><strong>Path:</strong> ${trip.route_path}
                       </div>`
                    : '';

                const reqsList = (trip.requirements && trip.requirements.length) ? trip.requirements : [];
                const requirementsHtml = reqsList.length > 0
                    ? `<div class="p-2 bg-light rounded-3 small text-secondary border-start border-3 border-warning mt-3">
                         <i class="bi bi-exclamation-triangle-fill text-warning me-1"></i><strong>Requirements:</strong> ${reqsList.join(' • ')}
                       </div>`
                    : '';

                html += `
                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden hover-shadow transition">
                        <div class="card-body p-4">
                            <div class="row align-items-center g-3">
                                
                                <!-- Column 1: Operator Logo & Class -->
                                <div class="col-12 col-md-4 border-end-md">
                                    <div class="mb-1">${logoHtml}</div>
                                    <div class="small fw-semibold text-dark operator-title">${trip.operator_name}</div>
                                    <span class="badge bg-primary-subtle text-primary mt-1 fw-normal">${trip.bus_class || 'Standard'}</span>
                                </div>

                                <!-- Column 2: Route, Timing & Duration -->
                                <div class="col-12 col-md-5">
                                    <div class="d-flex align-items-center justify-content-between mb-2">
                                        <div>
                                            <div class="fs-4 fw-bold text-dark">${trip.departure_time}</div>
                                            <div class="small text-muted">${trip.boarding_point}</div>
                                        </div>
                                        <div class="text-center px-2">
                                            <i class="bi bi-arrow-right text-muted fs-5"></i>
                                            <div class="small text-muted" style="font-size: 0.75rem;">${trip.duration}</div>
                                        </div>
                                        <div class="text-end">
                                            <div class="fs-6 fw-semibold text-secondary">Arrival</div>
                                            <div class="small text-muted">${trip.dropping_point}</div>
                                        </div>
                                    </div>

                                    <!-- Features & Route Path -->
                                    <div class="mt-2">
                                        ${featuresHtml}
                                        ${routePathHtml}
                                    </div>
                                </div>

                                <!-- Column 3: Price (Smaller & Dark/Gray) -->
                                <div class="col-12 col-md-3 text-md-end border-start-md ps-md-4">
                                    <div class="small text-muted mb-1">Fee per seat</div>
                                    <div class="fs-5 fw-bold text-dark mb-0">${trip.price}</div>
                                </div>

                            </div>

                            <!-- Requirements Banner -->
                            ${requirementsHtml}

                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            searchResultsContent.innerHTML = html;
        }

        operatorFilter.addEventListener('input', function (e) {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                renderTrips(currentTripsData);
                return;
            }
            const filtered = currentTripsData.filter(trip =>
                trip.operator_name.toLowerCase().includes(query)
            );
            renderTrips(filtered);
        });

        searchForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const formData = new FormData(searchForm);
            const searchParams = new URLSearchParams(formData).toString();

            operatorFilter.value = '';

            searchSubmitBtn.disabled = true;
            searchBtnIcon.classList.add('d-none');
            searchBtnSpinner.classList.remove('d-none');
            searchBtnText.textContent = 'Searching...';

            resultsWrapper.classList.remove('d-none');
            loadingSpinner.classList.remove('d-none');
            searchResultsContent.innerHTML = '';

            fetch(`/api/bus-search?${searchParams}`)
                .then(res => res.json())
                .then(data => {
                    loadingSpinner.classList.add('d-none');

                    if (!data.success || !data.trips || data.trips.length === 0) {
                        searchResultsContent.innerHTML = `
                        <div class="alert alert-warning text-center rounded-3 my-4">
                            ${data.error || 'No bus trips available for this route or date.'}
                        </div>`;
                        currentTripsData = [];
                        return;
                    }

                    currentTripsData = data.trips;
                    renderTrips(currentTripsData);
                })
                .catch(err => {
                    loadingSpinner.classList.add('d-none');
                    searchResultsContent.innerHTML = `<div class="alert alert-danger text-center">Failed to fetch route response. Check API endpoint logs.</div>`;
                })
                .finally(() => {
                    searchSubmitBtn.disabled = false;
                    searchBtnIcon.classList.remove('d-none');
                    searchBtnSpinner.classList.add('d-none');
                    searchBtnText.textContent = 'Search Trips';
                });
        });
    });
</script>
{% endblock %}
