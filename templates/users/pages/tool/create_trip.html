{% extends "users/layouts/base.html" %}

{% block title %}SmartTrip - Create Trip Plan & Real Nav{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<style>
    .map-container {
        height: 900px;
        border-radius: 16px;
        z-index: 1;
    }

    .sequence-badge {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        border: 2px solid #000;
    }

    .knn-card {
        border-left: 4px solid #ffc107;
        cursor: pointer;
        transition: all 0.2s;
    }

    .knn-card:hover {
        background-color: #fff3cd !important;
        transform: translateX(3px);
    }

    .leaflet-routing-container {
        max-height: 200px;
        overflow-y: auto;
        opacity: 0.95;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-4 mx-auto" style="max-width: 1300px;">
    <div class="row g-4">
        <!-- Form Column (Left Side) -->
        <div class="col-lg-4">
            <div class="card card-custom border-0 shadow-sm h-100">
                <div class="card-body p-4">
                    <form action="/trip/create" method="POST" id="tripForm">

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted text-uppercase">Trip Title</label>
                            <input type="text" name="title"
                                class="form-control bg-light border-0 rounded-pill px-3 py-2"
                                placeholder="e.g., Yangon Food & Culture Tour" required>
                        </div>

                        <!-- Starting Point -->
                        <div class="mb-3 p-3 bg-light rounded-4 border">
                            <p class="small text-muted mb-2" id="location-status">Using GPS / Default location</p>
                            <input type="hidden" name="start_lat" id="start_lat" value="{{ user.latitude or 16.8661 }}">
                            <input type="hidden" name="start_lng" id="start_lng"
                                value="{{ user.longitude or 96.1951 }}">
                            <button type="button" class="btn btn-sm btn-dark rounded-pill w-100"
                                onclick="getUserLocation()">
                                🎯 Update to Current GPS
                            </button>
                        </div>

                        <!-- Dynamic Waypoints (Places + Restaurants) -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label class="form-label small fw-bold text-muted text-uppercase mb-0">Waypoints &
                                    Restos</label>
                                <button type="button" class="btn btn-sm btn-outline-primary rounded-pill py-0 px-2"
                                    onclick="addWaypoint()">+ Add Stop</button>
                            </div>
                            <div id="waypoints-container" class="d-flex flex-column gap-2"></div>
                        </div>

                        <div
                            class="mb-3 p-3 bg-warning bg-opacity-10 rounded-4 border border-warning position-relative">
                            <label class="form-label small fw-bold text-dark text-uppercase">🏁 Final
                                Destination</label>

                            <input type="text" id="dest_search_input"
                                class="form-control border-0 bg-white rounded-pill px-3 py-2 shadow-sm"
                                placeholder="Type to search destination..." autocomplete="off" required>

                            <input type="hidden" name="dest_place_id" id="dest_place_id_hidden">

                            <ul id="dest_suggestions"
                                class="list-group position-absolute w-100 shadow rounded-3 mt-1 overflow-auto d-none z-3"
                                style="max-height: 200px; left: 0;">
                            </ul>
                        </div>
                        <!-- KNN Recommendation Box -->
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted text-uppercase">🤖 KNN  Suggestions
                                (Closest Next Stops)</label>
                            <div id="knn-suggestions" class="d-flex flex-column gap-2">
                                <span class="text-muted small italic">Select a location to view nearest
                                    recommendations...</span>
                            </div>
                        </div>

                        <button type="submit"
                            class="btn btn-primary w-100 rounded-pill py-3 fw-bold text-dark shadow-sm"
                            style="background-color: #ffc107; border: none;">
                            Save Trip & Route
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Interactive Map (Right Side) -->
        <div class="col-lg-8">
            <div class="card card-custom border-0 shadow-sm p-2">
                <div id="map" class="map-container"></div>
            </div>
        </div>
    </div>
</div>

<!-- Waypoint Row Template -->
<template id="waypoint-template">
    <div class="d-flex gap-2 waypoint-row align-items-center">
        <span class="sequence-badge bg-light text-dark shadow-sm stop-number"></span>
        <select name="waypoints[]"
            class="form-select border-0 bg-light rounded-pill px-3 location-select waypoint-select">
            <option value="" selected disabled>Choose stop or click map marker...</option>
            {% for loc in locations %}
            <option value="{{ loc.id }}" data-id="{{ loc.id }}" data-lat="{{ loc.lat }}" data-lng="{{ loc.lng }}"
                data-name="{{ loc.name }}">
                {% if loc.type == 'restaurant' %}🍽️{% else %}📍{% endif %} {{ loc.name }}
            </option>
            {% endfor %}
        </select>
        <button type="button" class="btn btn-sm btn-danger rounded-circle text-white p-0"
            style="width: 32px; height: 32px;" onclick="removeWaypoint(this)">×</button>
    </div>
</template>

<script>
    const allLocations = {{ locations_json | safe }};
    let map;
    let routingControl = null;
    let locationMarkers = [];
    let waypointCount = 0;

    // Track selected destination object
    let selectedDestination = null;

    document.addEventListener("DOMContentLoaded", function () {
        const startLat = parseFloat(document.getElementById('start_lat').value);
        const startLng = parseFloat(document.getElementById('start_lng').value);

        // 1. Initialize Leaflet Map
        map = L.map('map').setView([startLat, startLng], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        // 2. Render all places and restaurants on map as interactive markers
        renderAllMapMarkers();

        // 3. Add initial empty waypoint
        addWaypoint();

        // 4. Update route when waypoint selects change
        document.getElementById('tripForm').addEventListener('change', function (e) {
            if (e.target.classList.contains('location-select')) {
                updateMapRouteAndKNN();
            }
        });

        // 5. Setup Type-to-Search Destination logic
        setupDestinationSearch();

        // 6. Initial route render
        updateMapRouteAndKNN();
    });

    function setupDestinationSearch() {
        const places = allLocations.filter(loc => loc.type === 'place');
        const searchInput = document.getElementById('dest_search_input');
        const hiddenInput = document.getElementById('dest_place_id_hidden');
        const suggestionsList = document.getElementById('dest_suggestions');

        // Filter and display suggestions on typing
        searchInput.addEventListener('input', function () {
            const query = this.value.toLowerCase().trim();
            suggestionsList.innerHTML = '';
            hiddenInput.value = ''; 
            selectedDestination = null;
            updateMapRouteAndKNN();

            if (!query) {
                suggestionsList.classList.add('d-none');
                return;
            }

            const matches = places.filter(p => p.name.toLowerCase().includes(query));

            if (matches.length === 0) {
                suggestionsList.innerHTML = '<li class="list-group-item text-muted small">No places found</li>';
            } else {
                matches.forEach(p => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item list-group-item-action cursor-pointer';
                    li.textContent = p.name;

                    li.addEventListener('click', function () {
                        searchInput.value = p.name;
                        hiddenInput.value = p.real_id;
                        selectedDestination = p; 
                        suggestionsList.classList.add('d-none');
                        
                        updateMapRouteAndKNN(); 
                    });

                    suggestionsList.appendChild(li);
                });
            }

            suggestionsList.classList.remove('d-none');
        });

        document.addEventListener('click', function (e) {
            if (!searchInput.contains(e.target) && !suggestionsList.contains(e.target)) {
                suggestionsList.classList.add('d-none');
            }
        });
    }

    function renderAllMapMarkers() {
        allLocations.forEach(loc => {
            const isResto = loc.type === 'restaurant';
            const markerColor = isResto ? '#dc3545' : '#0d6efd';

            const customIcon = L.divIcon({
                className: 'custom-map-pin',
                html: `<div style="background:${markerColor}; color:#fff; border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,0.3); font-size:12px;">${isResto ? '🍽️' : '📍'}</div>`,
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });

            const marker = L.marker([loc.lat, loc.lng], { icon: customIcon }).addTo(map);

            const popupContent = `
                <div class="text-center p-1">
                    <h6 class="fw-bold mb-1">${loc.name}</h6>
                    <span class="badge ${isResto ? 'bg-danger' : 'bg-primary'} mb-2">${loc.type.toUpperCase()}</span><br>
                    <button type="button" class="btn btn-sm btn-dark rounded-pill px-3 py-1 mt-1" onclick="selectLocationFromMap('${loc.id}')">
                        + Add to Route
                    </button>
                </div>
            `;
            marker.bindPopup(popupContent);
            locationMarkers.push(marker);
        });
    }

    function selectLocationFromMap(locId) {
        let targetSelect = null;
        const selects = document.querySelectorAll('.waypoint-select');

        for (let sel of selects) {
            if (!sel.value) {
                targetSelect = sel;
                break;
            }
        }

        if (!targetSelect) {
            addWaypoint();
            const newSelects = document.querySelectorAll('.waypoint-select');
            targetSelect = newSelects[newSelects.length - 1];
        }

        targetSelect.value = locId;
        map.closePopup();
        updateMapRouteAndKNN();
    }

    function addWaypoint() {
        waypointCount++;
        const template = document.getElementById('waypoint-template').content.cloneNode(true);
        template.querySelector('.stop-number').textContent = waypointCount;
        document.getElementById('waypoints-container').appendChild(template);
    }

    function removeWaypoint(btn) {
        btn.closest('.waypoint-row').remove();
        waypointCount = 0;
        document.querySelectorAll('.stop-number').forEach(badge => {
            waypointCount++;
            badge.textContent = waypointCount;
        });
        updateMapRouteAndKNN();
    }

    // Real OSRM Road Routing + KNN Query
    function updateMapRouteAndKNN() {
        const waypoints = [];

        // 1. Start Location
        const startLat = parseFloat(document.getElementById('start_lat').value);
        const startLng = parseFloat(document.getElementById('start_lng').value);
        if (!isNaN(startLat) && !isNaN(startLng)) {
            waypoints.push(L.latLng(startLat, startLng));
        }

        let knnTargetLat = startLat;
        let knnTargetLng = startLng;

        // 2. Intermediate Stops
        const waypointSelects = document.querySelectorAll('.waypoint-select');
        waypointSelects.forEach(select => {
            const opt = select.options[select.selectedIndex];
            if (opt && opt.value) {
                const lat = parseFloat(opt.getAttribute('data-lat'));
                const lng = parseFloat(opt.getAttribute('data-lng'));
                if (!isNaN(lat) && !isNaN(lng)) {
                    waypoints.push(L.latLng(lat, lng));
                    knnTargetLat = lat;
                    knnTargetLng = lng;
                }
            }
        });

        // 3. Destination Point (using variable set by search input)
        if (selectedDestination && selectedDestination.lat && selectedDestination.lng) {
            waypoints.push(L.latLng(selectedDestination.lat, selectedDestination.lng));
        }

        // 4. Update OSRM Road Routing Engine
        if (routingControl) map.removeControl(routingControl);

        if (waypoints.length > 1) {
            routingControl = L.Routing.control({
                waypoints: waypoints,
                routeWhileDragging: false,
                addWaypoints: false,
                lineOptions: {
                    styles: [{ color: '#0d6efd', opacity: 0.8, weight: 6 }]
                },
                createMarker: function (i, wp, nWps) {
                    let label = i === 0 ? '📍 Start' : (i === nWps - 1 ? '🏁 Finish' : `Stop ${i}`);
                    return L.marker(wp.latLng).bindPopup(`<b>${label}</b>`);
                }
            }).addTo(map);
        }

        // 5. Trigger KNN recommendations
        if (!isNaN(knnTargetLat) && !isNaN(knnTargetLng)) {
            fetchKNNRecommendations(knnTargetLat, knnTargetLng);
        }
    }

    // Call Flask KNN Endpoint
    function fetchKNNRecommendations(lat, lng) {
        fetch('/api/knn/nearest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lat: lat, lng: lng, locations: allLocations })
        })
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('knn-suggestions');
                if (!container) return;
                container.innerHTML = '';

                if (data.nearest) {
                    data.nearest.forEach(loc => {
                        const card = document.createElement('div');
                        card.className = 'p-2 bg-light rounded-3 knn-card d-flex justify-content-between align-items-center';
                        card.innerHTML = `
                        <div>
                            <strong class="d-block text-dark small">${loc.name}</strong>
                            <span class="text-muted" style="font-size: 0.75rem;">Type: ${loc.type}</span>
                        </div>
                        <button type="button" class="btn btn-xs btn-outline-dark rounded-pill py-0 px-2" style="font-size: 0.75rem;">+ Add</button>
                    `;
                        card.onclick = () => selectLocationFromMap(loc.id);
                        container.appendChild(card);
                    });
                }
            })
            .catch(err => console.error("KNN fetch error:", err));
    }

    function getUserLocation() {
        const status = document.getElementById('location-status');
        if (!navigator.geolocation) return;
        status.textContent = "Locating...";
        navigator.geolocation.getCurrentPosition((pos) => {
            document.getElementById('start_lat').value = pos.coords.latitude;
            document.getElementById('start_lng').value = pos.coords.longitude;
            status.textContent = "📍 Updated to GPS Location";
            updateMapRouteAndKNN();
        });
    }
</script>
{% endblock %}
