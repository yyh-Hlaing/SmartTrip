{% extends "users/layouts/base.html" %}

{% block title %}SmartTrip - Change Password{% endblock %}

{% block content %}

<div x-data="{ show: false, message: '', type: 'success' }" @password-alert.window="
        show = true;
        message = $event.detail.msg;
        type = $event.detail.type;
        setTimeout(() => show = false, 4000)
    " x-show="show" x-transition class="alert rounded-3 fw-medium shadow-sm"
    :class="type === 'success' ? 'alert-success' : 'alert-danger'"
    style="position: fixed; top: 80px; right: 24px; z-index: 9999; min-width: 300px;" 
    role="alert">
    <span x-text="message"></span>
</div>

<div class="container my-2">

    <div class="mb-4">
        <h2 class="fw-bold text-dark">Security Settings</h2>
        <p class="text-muted">Update your password to keep your SmartTrip account secure.</p>
    </div>

    <div class="card card-custom border-0 shadow-sm mb-5">
        <div class="card-body p-4 p-md-5">
            <h4 class="fw-bold mb-4 text-dark">Change Password</h4>

            <form @submit.prevent="
                let currentPassword = document.getElementById('current_password').value;
                let newPassword = document.getElementById('new_password').value;
                let confirmPassword = document.getElementById('confirm_password').value;

                if (newPassword !== confirmPassword) {
                    window.dispatchEvent(new CustomEvent('password-alert', { detail: { msg: 'New passwords do not match.', type: 'danger' } }));
                    return;
                }

                fetch('/api/user/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') {
                        window.dispatchEvent(new CustomEvent('password-alert', { detail: { msg: 'Password updated successfully!', type: 'success' } }));
                        $el.reset();
                    } else {
                        window.dispatchEvent(new CustomEvent('password-alert', { detail: { msg: data.message || 'Failed to update password.', type: 'danger' } }));
                    }
                })
                .catch(err => {
                    window.dispatchEvent(new CustomEvent('password-alert', { detail: { msg: 'A network or server error occurred.', type: 'danger' } }));
                })
            ">

                <div class="vstack gap-3">
                    <div>
                        <label for="current_password" class="form-label fw-semibold text-secondary small">Current Password</label>
                        <input type="password" id="current_password" name="current_password" placeholder="Enter current password" required class="form-control form-control-custom">
                    </div>

                    <div>
                        <label for="new_password" class="form-label fw-semibold text-secondary small">New Password</label>
                        <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required class="form-control form-control-custom">
                    </div>

                    <div>
                        <label for="confirm_password" class="form-label fw-semibold text-secondary small">Confirm New Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required class="form-control form-control-custom">
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-4 mt-4 border-top">
                    <a href="/user/settings" class="text-muted text-decoration-none small fw-medium">← Back to Settings</a>
                    <button type="submit" class="btn btn-gold px-4 py-2 rounded-3 shadow-sm">
                        Update Password
                    </button>
                </div>

            </form>
        </div>
    </div>

</div>
{% endblock %}
