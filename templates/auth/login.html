<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTrip - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>

<body class="auth-body">

    <ul class="bg-slideshow">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <div class="theme-card text-center">
        <div class="icon">
            <i class="fa-solid fa-house"></i>
        </div>
        <h2 class="card-title mb-2">Smart<span>Trip</span></h2>
        <p class="mb-4" style="color: #4a5568; font-weight: 400; font-size: 0.95rem;">Welcome back! Please login to your
            account</p>

        <div id="alert-box" class="alert alert-status text-center py-2 mb-4" role="alert" style="display:none;"></div>

        <form id="login-form">

            <div class="mb-4 text-start">
                <input type="text" class="form-control form-control-custom" id="username"
                    placeholder="Enter Your username" required autocomplete="off">
            </div>

            <div class="mb-4 text-start">
                <input type="password" class="form-control form-control-custom" id="password"
                    placeholder="Enter Your password" required>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-custom">Login</button>
            </div>
        </form>

        <div class="footer-text mt-4">
            Don't have an account? <a href="/register" class="footer-link">Register</a>
        </div>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alert-box');

            fetch('/signin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        alertBox.style.display = 'block';
                        alertBox.className = "alert alert-success text-success py-2 mb-4";
                        alertBox.style.background = "rgba(40, 167, 69, 0.15)";
                        alertBox.style.border = "1px solid rgba(40, 167, 69, 0.4)";
                        alertBox.innerText = data.message;
                        const redirectUrl = (data.role === 'Admin')
                            ? '/admin/dashboard'
                            : '/user/dashboard';

                        setTimeout(() => {
                            window.location.href = redirectUrl;
                        }, 1500);
                    } else {
                        alertBox.style.display = 'block';
                        alertBox.className = "alert alert-danger text-danger py-2 mb-4";
                        alertBox.style.background = "rgba(220, 53, 69, 0.15)";
                        alertBox.style.border = "1px solid rgba(220, 53, 69, 0.4)";
                        alertBox.innerText = data.message;
                    }
                })
                .catch(error => {
                    alertBox.style.display = 'block';
                    alertBox.className = "alert alert-danger text-danger py-2 mb-4";
                    alertBox.innerText = "Connection error. Please try again.";
                });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
</body>

</html>
