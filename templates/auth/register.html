<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTrip - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-body">

    <ul class="bg-slideshow">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <div class="theme-card text-center">
        
        <h2 class="card-title mb-2">Smart<span>Trip</span></h2>
        <p class="mb-4" style="color: #4a5568; font-weight: 400; font-size: 0.95rem;">Create an account to start your journey</p>

        <div id="alert-box" class="alert alert-status text-center py-2 mb-4" role="alert"></div>
        
        <form id="register-form">
            <div class="mb-3 text-start">
                <input type="text" class="form-control form-control-custom" id="username" placeholder="Enter Your username" required autocomplete="off">
            </div>

            <div class="mb-3 text-start">
                <input type="email" class="form-control form-control-custom" id="email" placeholder="Enter Your email" required autocomplete="off">
            </div>
            
            <div class="mb-3 text-start">
                <input type="password" class="form-control form-control-custom" id="password" placeholder="Enter Your password" required>
            </div>

            <div class="mb-4 text-start">
                <input type="password" class="form-control form-control-custom" id="confirm_password" placeholder="Confirm Your password" required>
            </div>

            
            
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-custom">Sign Up</button>
            </div>
        </form>
        
        <div class="footer-text mt-3">
            Already have an account? <a href="/login" class="footer-link">Log In</a>
        </div>

    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            const alertBox = document.getElementById('alert-box');

            if (password !== confirm_password) {
                showAlert("Passwords do not match!", "danger");
                return;
            }

            fetch('/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: username,
                    email: email,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    showAlert(data.message, "success");
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showAlert(data.message, "danger");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showAlert("Something went wrong. Server error.", "danger");
            });

            function showAlert(message, type) {
                alertBox.style.display = 'block';
                if (type === "success") {
                    alertBox.className = "alert alert-status alert-success text-success py-2 mb-4";
                    alertBox.style.background = "rgba(40, 167, 69, 0.15)";
                    alertBox.style.border = "1px solid rgba(40, 167, 69, 0.4)";
                } else {
                    alertBox.className = "alert alert-status alert-danger text-danger py-2 mb-4";
                    alertBox.style.background = "rgba(220, 53, 69, 0.15)";
                    alertBox.style.border = "1px solid rgba(220, 53, 69, 0.4)";
                }
                alertBox.innerText = message;
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
